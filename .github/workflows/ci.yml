name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Merging a version bump publishes it (release.yml), with notes from CHANGELOG.md.
      - name: CHANGELOG.md has a section for the version
        run: |
          version="$(node -p "require('./package.json').version")"
          grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md || { echo "Add a '## $version' section to CHANGELOG.md" >&2; exit 1; }
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:lib
