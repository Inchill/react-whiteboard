name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick the arrow tool
        2. Drag from …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, iPad Safari with Apple Pencil, …
  - type: input
    id: version
    attributes:
      label: Package version (if you use it as a library)
